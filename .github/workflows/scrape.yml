name: Pobierz wyniki PZPN

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalacja zależności
        run: |
          cd scraper
          npm install

      - name: Uruchom scraper
        run: |
          cd scraper
          node scrape.js

      - name: Zapisz wyniki do repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/matches.png data/meta.json
          git diff --staged --quiet || git commit -m "Aktualizacja wyników $(date +'%Y-%m-%d %H:%M')"
          git push
